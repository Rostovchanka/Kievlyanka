name: Build Standalone Elsewhere for Windows
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Get Elsewhere source
        uses: actions/checkout@v4
      - name: Install build-time Python (not required by end users)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install image processing and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate photo engine and desktop interface
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests
          python -m compileall -q elsewhere_studio.py engine.py io_formats.py recipe.py
          python elsewhere_studio.py --self-test
      - name: Package app and Python runtime into one portable folder
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name "Elsewhere Studio" --collect-all rawpy --collect-all tifffile elsewhere_studio.py
          if (-not (Test-Path 'dist/Elsewhere Studio/Elsewhere Studio.exe')) { throw 'Missing built executable' }
      - name: Smoke-test standalone Windows executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath 'dist/Elsewhere Studio/Elsewhere Studio.exe' -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Standalone EXE smoke test failed: $($p.ExitCode)" }
      - name: Zip the portable Windows application
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/Elsewhere Studio' -DestinationPath 'Elsewhere-Studio-Windows-Portable.zip' -CompressionLevel Optimal
      - name: Upload downloadable app (Python not needed to run it)
        uses: actions/upload-artifact@v4
        with:
          name: Elsewhere-Studio-Windows-Portable
          path: Elsewhere-Studio-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
